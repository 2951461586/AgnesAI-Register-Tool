[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agnesai-register-tool"
version = "0.1.0"
description = "Agnes AI 注册 + API Key 提取（CF Worker 域名邮箱 + 验证码，零浏览器）"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    # 🔴 `[socks]` extra 是**必需的** —— 槽位池 / `AR_PROXY` 支持 `socks5h://`，
    #    而 requests 走 SOCKS 需要 PySocks。只写 `requests` 的话，本机可能因为
    #    别的原因恰好装着而跑得通，但**换台机器就 `InvalidSchema`**（部署时才炸）。
    #    与 requirements.txt 保持一致。
    "requests[socks]>=2.31",
]

# 开发依赖与运行依赖分开 —— 运行依赖只有 requests。
# CI（`.github/workflows/ci.yml`）只装运行依赖 + dev 组。
# 🔴 用例是**离线**的（零网络）⇒ CI 里**不需要任何凭据**（没有 AR_WORKER_* /
#    `.env` 也全绿）。这一点由 `tests/conftest.py` 的夹具保证。
# 🔴 这条声称有守卫用例钉住：`tests/test_doc_contract.py` 里的
#    `test_ci_claim_implies_ci_config_exists` —— 说了有 CI 就必须真有。
#    （之前这里写过"CI 的 secret-scan job"，而仓库里什么配置都没有。）
#
# 🔴 ruff 锁到次版本：它会随次版本**新增规则**，不锁的话某天会因为
#    "上游发新版"而红，跟当次改动毫无关系（且这种红很容易被当成噪声忽略）。
[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.16,<0.17",
]

# ⚠ 包名就叫 `src`，是个很泛的名字。之所以不改：全库有 20+ 处
#    `from src.xxx import`，改名是纯 churn、且会让 git blame 失去意义。
#    本项目**不要求** `pip install -e .` —— 测试靠 pytest 的 `pythonpath`，
#    工具靠 `tools/_bootstrap.py`。这条配置只是让"想装的人装得上"。
#
# 🔴 `packages` 是**显式列表**，不会自动发现子包。**每次新增顶层包
#    （或子包）都要回到这里加。**
[tool.setuptools]
packages = ["src", "common"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 🔴 `pythonpath = ["."]` 让 tests/ 里能直接 `from src import ...`，
#    不需要在每个测试文件顶部写 sys.path.insert。
pythonpath = ["."]
# 🔴 `-rs` 让"跳过的用例"把**原因**打出来。
addopts = "-q --strict-markers -rs"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".workbuddy-ai", "__pycache__"]

[tool.ruff.lint]
# 保守起步：只开"几乎不会误报"的规则族。
# 🔴 刻意**不**开 D（docstring）、ANN（标注）、C90（复杂度）——
#    本项目的注释密度和函数长度是有意为之，用它们刷出来的告警只会被
#    `# noqa` 淹没，最后连真问题一起被忽略。
select = ["E", "F", "I", "UP", "B"]
ignore = [
    # E501 行宽：本项目的注释里大量是中文长句 + 实测数据表，折行会更难读。
    "E501",
    # B008 函数调用作默认值：本项目用它做"可注入的默认实现"（如 log=print）。
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# tools/ 下的脚本有**结构性**的 E402，不是疏漏：
#   1. `from _bootstrap import ROOT` 必须排在 `from src ...` 之前
#      （副作用导入：把仓库根加进 sys.path）
#   2. `sys.stdout = io.TextIOWrapper(...)` 要尽早执行，否则中文/emoji 打不出来
"tools/**/*.py" = ["E402"]
"tools/_bootstrap.py" = ["F401"]
# `src/pipeline/__init__.py` 是**纯转出层**：它 import 进来的名字**就是**它的对外
# API，本地当然"用不到" ⇒ F401 在这里是噪音。
# ⚠ 代价：这个文件里**真的**多余的 import 不会被报出来。但"转出漏了"会被用例
#    直接抓到（`tests/` 会 AttributeError），所以这个代价可以接受。
"src/pipeline/__init__.py" = ["F401"]

[tool.pyright]
# 🔴 基线是**干净**的（pyright 1.1.414，2026-10-14：50 个文件、0 error、0 warning）
#    ⇒ 所以这里**不需要**"先豁免一堆历史问题"，任何新报错就是本次改动引入的。
#
# ⚠ 顺带说明：IDE / LSP 侧报的那些
#      `"jsonlstore" is unknown import symbol`
#    是**陈旧索引**的假阳性 —— 真正跑一遍 pyright 是干净的。诊断依据：那份
#    索引快照里既没有新模块，又还列着 4 个**已不存在**的文件。
include = ["src", "common", "tools", "tests", "run.py"]
# 这些目录里没有 .py（台账 / 状态 / 备份都是数据），显式排除免得白扫。
exclude = ["**/__pycache__", "backups", "ledger", "state", "exports", ".workbuddy-ai"]
pythonVersion = "3.11"
# ⚠ 显式写死检查级别（而不是吃默认值）：默认值会随 pyright 版本变，而那会让
#    "某天 CI 无缘无故变红" —— 与 ruff 锁次版本是同一个理由。
typeCheckingMode = "standard"

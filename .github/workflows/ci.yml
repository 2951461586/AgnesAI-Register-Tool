name: CI

# 🔴 这个文件的存在本身有守卫用例钉住：
#    `tests/test_doc_contract.py::test_ci_claim_implies_ci_config_exists`
#    —— 一旦文档里声称"CI 会做 X"而这里没有工作流，用例会红。
#    （之前 pyproject 就声称过"CI 的 secret-scan job"，而仓库里什么都没有。）

on:
  push:
    branches: ["**"]
  pull_request:

# 🔴 最小权限：CI 只需要读代码。这个仓库里全是明文凭据（台账/JWT/sk- key/
#    代理账密），所以"CI 被攻破能做什么"要压到最小。
permissions:
  contents: read

# 同一分支的新 push 取消旧的运行 —— 省额度，也让红灯更快出现。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 离线用例 + lint ────────────────────────────────────────────
  test:
    name: pytest + ruff (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `pyproject.toml` 声明 requires-python >= 3.11，所以测两端。
        python-version: ["3.11", "3.12"]
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # 🔴 checkout 默认把 GITHUB_TOKEN 留在 `.git/config` 里，后续步骤
          #    （包括第三方 action）都能读到它。本 job 不需要 push ⇒ 关掉。
          persist-credentials: false

      # actions/setup-python v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          # 只装运行依赖 + dev 组。
          # 🔴 用例是**离线**的（零网络），所以这里**不需要任何凭据** ——
          #    没有 AR_WORKER_* / .env 也照样全绿。
          #    这一点由 `tests/conftest.py` 的夹具保证（它把宿主的域名池/
          #    槽位池/状态文件全部替换成确定值）。曾经不成立：清掉 AR_WORKER_*
          #    后 success 路径会以"没有可用的收信域名"失败。
          pip install -r requirements.txt
          pip install "pytest>=8" "ruff>=0.16,<0.17"

      - name: ruff（lint）
        run: python -m ruff check .

      - name: ruff（format 检查）
        run: python -m ruff format --check .

      - name: 离线用例（零网络）
        run: python -m pytest -q

  # ── 类型检查 ───────────────────────────────────────────────
  # 为什么值得单独一个 job：本会话里 pyright **真的**抓到过一个类型问题
  # （`FakeMail(code=None)` 与 `code: str` 不兼容）—— 而那个替身恰好是回归
  # 用例的基础。所以它不是"好看"，是有实战价值的。
  #
  # 🔴 基线是**干净**的（50 个文件、0 error、0 warning）⇒ 没有"先豁免一堆
  #    历史问题"这回事，任何新报错都是本次改动引入的。
  typecheck:
    name: pyright
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"

      # actions/setup-python v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装运行依赖 + pytest
        # 🔴 pyright 要能解析它 `include` 到的**所有**代码的 import：
        #    · `import requests`（运行依赖）
        #    · `import pytest`（`tests/` 里的用例 —— 而 `pyproject.toml` 的
        #      `[tool.pyright] include` 覆盖 `tests/`）
        #    ⚠ **实测事故（2026-10-15，本仓库首次跑 CI）**：这一行原本只装了
        #      `requests` ⇒ pyright 报 13 个 `reportMissingImports`、job 红。
        #      而**本地**永远是绿的（本机装了 pytest）⇒ 典型的“本地绿、CI 红”，
        #      只有把依赖口径钉住才不会再犯（守卫：
        #      `tests/test_doc_contract.py::test_pyright_job_installs_pytest`）。
        run: |
          pip install -r requirements.txt
          pip install "pytest>=8"

      - name: pyright（类型检查）
        # 🔴 锁版本：与 ruff 锁次版本同一个理由 —— 上游发新版新增规则会让 CI
        #    无缘无故变红，而那种红很容易被当成噪声忽略。
        #    配置在 pyproject.toml 的 [tool.pyright]（含显式的 typeCheckingMode）。
        run: npx --yes pyright@1.1.414

  # ── 密钥扫描 ───────────────────────────────────────────────────
  # 为什么单独一个 job：本仓库是**公开**的，而它整条链路都在处理明文凭据
  # （`.env` 的 Worker token、`ledger/` 的邮箱+密码+JWT+`sk-` key、`.slots.txt`
  # 的代理账密）。这些文件都在 `.gitignore` 里，但"配了忽略"挡不住
  # `git add -f`、也挡不住别人改了 `.gitignore`。
  #
  # ⚠ 本地也有一条同样的检查：`tests/test_doc_contract.py` 里的
  #   `test_no_secret_shapes_in_shipped_files`（零依赖、离线跑）。
  #   这个 job 覆盖面更广（全历史 + 更全的规则集），两者互补。
  secret-scan:
    name: secret-scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          # 🔴 必须全历史：只扫最后一次提交会漏掉"以前提交过、后来删掉"的凭据
          #    —— 而那种凭据在 git 历史里**永远存在**。
          fetch-depth: 0
      # gitleaks/gitleaks-action v2.3.9
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ⚠ gitleaks-action 对**组织**账号需要 GITLEAKS_LICENSE（个人账号免费）。
          #    如果这个 job 因为 license 报错，两个选择：
          #      ① 配一个 GITLEAKS_LICENSE secret；
          #      ② 删掉这个 job —— 本地的 `test_no_secret_shapes_in_shipped_files`
          #         仍在跑（覆盖面小一些，但零依赖、且每次 pytest 都跑）。
